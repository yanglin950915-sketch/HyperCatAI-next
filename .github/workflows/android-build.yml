name: Android build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/multi-pet-engine]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperCatAI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for pushed versions
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate publication."
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --title "HyperCat AI $VERSION_NAME" \
              --notes "HyperCat AI $VERSION_NAME 自动构建版本。安装前请确认来源为 HyperCat AI 官方仓库。" \
              --target "$GITHUB_SHA"
          fi
