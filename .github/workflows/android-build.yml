name: Android build
on:
  pull_request:
    branches: [main, feat/live2d-avatar-agent-integration, feature/rear-agent-unified-v0.9.21, feature/rear-agent-interaction-v0.9.22, feature/direct-rear-projection-v0.9.24, fix/rear-ai-wallpaper-picker-v0.9.29, fix/live2d-model-zip-import]
  push:
    branches: [fix/v0.9.40-splash-rearscreen-anime, feat/rear-voice-v0.9.36, main, feature/direct-rear-projection-v0.9.24, fix/rear-ai-wallpaper-picker-v0.9.29]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HYPERCAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing HYPERCAT_KEYSTORE_BASE64 repository secret" && exit 1)
          mkdir -p "$RUNNER_TEMP/hypercat-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hypercat-signing/hypercat-release.jks"
          test -s "$RUNNER_TEMP/hypercat-signing/hypercat-release.jks"
      - name: Build debug APK with stable signature
        env:
          HYPERCAT_KEYSTORE_PATH: ${{ runner.temp }}/hypercat-signing/hypercat-release.jks
          HYPERCAT_KEYSTORE_PASSWORD: ${{ secrets.HYPERCAT_KEYSTORE_PASSWORD }}
          HYPERCAT_KEY_ALIAS: ${{ secrets.HYPERCAT_KEY_ALIAS }}
          HYPERCAT_KEY_PASSWORD: ${{ secrets.HYPERCAT_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK with version
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "HyperCatAI-v${VERSION_NAME}-debug.apk"
      - name: Verify APK signature
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "HyperCatAI-v${VERSION_NAME}-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperCatAI-v0.9.44-debug
          path: HyperCatAI-v0.9.44-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for pushed versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate publication."
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --title "HyperCat AI $VERSION_NAME" \
              --notes "HyperCat AI $VERSION_NAME stable-signed automatic build. Keep this signing identity for all future updates." \
              --target "$GITHUB_SHA"
          fi
