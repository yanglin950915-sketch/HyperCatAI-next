name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify complete rearscreen folder
        run: |
          test -s rearscreen/manifest.xml
          test "$(find rearscreen -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Upload rearscreen folder
        uses: actions/upload-artifact@v4
        with:
          name: rearscreen-folder
          path: rearscreen/
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperCatAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
