name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete rearscreen folder
        run: |
          test -s rearscreen/manifest.xml
          test "$(find rearscreen -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Upload rearscreen folder
        uses: actions/upload-artifact@v4
        with:
          name: rearscreen-folder
          path: rearscreen/
          if-no-files-found: error
          retention-days: 14
