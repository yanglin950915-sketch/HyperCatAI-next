<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000"><title>HyperCat Face Engine</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#e8f7ff;font-family:system-ui,sans-serif}main{height:100%;display:flex;flex-direction:column;background:#000}header{padding:10px 16px 4px;display:flex;justify-content:space-between}.brand{font-size:10px;letter-spacing:.2em;font-weight:700;color:#7ddfff}.version{font-size:9px;color:#496579}.stage{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block}.controls{padding:7px 10px 9px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#050b12}button{border:1px solid #18384a;border-radius:9px;background:#081722;color:#bdefff;padding:7px 2px;font-size:11px;min-height:34px}button.active{background:#10344a;border-color:#43c9f2;color:#fff}</style></head><body><main><header><div class="brand">HYPERCAT · FACE ENGINE</div><div class="version">LIVE PREVIEW</div></header><section class="stage"><canvas id="face" aria-label="HyperCat animated cat expression"></canvas></section><nav class="controls"><button data-mood="idle" class="active">待机</button><button data-mood="happy">开心</button><button data-mood="curious">好奇</button><button data-mood="thinking">思考</button><button data-mood="sleepy">困倦</button><button data-mood="sad">委屈</button><button data-mood="angry">生气</button><button data-mood="surprised">惊讶</button><button data-mood="love">喜欢</button><button data-mood="sleep">睡觉</button></nav></main><script src="face-engine.js"></script><script>
(function(){var canvas=document.getElementById("face"),face=window.HyperCatFace.create(canvas),buttons=document.querySelectorAll("[data-mood]");Array.prototype.forEach.call(buttons,function(b){b.addEventListener("click",function(){var mood=b.getAttribute("data-mood");face.setMood(mood);Array.prototype.forEach.call(buttons,function(x){x.classList.remove("active");});b.classList.add("active");if(window.HyperCatBridge&&window.HyperCatBridge.onMoodChanged){window.HyperCatBridge.onMoodChanged(mood);}});});canvas.addEventListener("pointermove",function(e){var r=canvas.getBoundingClientRect();face.setGaze(((e.clientX-r.left)/r.width-.5)*1.4,((e.clientY-r.top)/r.height-.5)*1.2);});canvas.addEventListener("pointerleave",function(){face.setGaze(0,0);});canvas.addEventListener("click",function(){face.setMood("happy",220);if(window.HyperCatBridge&&window.HyperCatBridge.onMoodChanged){window.HyperCatBridge.onMoodChanged("happy");}});window.HyperCatPreview={setMood:function(m){face.setMood(m);},getMood:function(){return face.getMood();}};}());
</script></body></html>
