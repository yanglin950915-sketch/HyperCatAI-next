<!-- SAFE_ZONE: BASE_CAM=301 | OUTER.x=321 OK | HEADER.x=344 OK | FACE.x=377 OK | REPLY.x=344 OK | BUTTONS.x=364/538/713 OK | CHILD.x=344 OK | max_x=862 <= 884 OK -->
<!-- AVAIL: 563x532 ratio=1.06 | OUTER 563x532 fill=100% | CHILD 518x497 fillW=92.01% fillH=93.42% ratio=1.04 deviation=1.5% OK -->
<!-- TOUCH: FACE 450x261 OK | PET 130x60 OK | THINK 130x60 OK | REST 130x60 OK | gaps=44/45px, hitPad=12px, effectiveGap>=20px OK -->
<!-- The engine uses cachePage="true"; clear the cache or reinstall the widget after editing the file. -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>HyperCat AI 背屏萌宠</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="rear" aria-label="HyperCat AI 背屏萌宠"></canvas>
<script>
(function(){
"use strict";

/* For four-language support, replace only this section. */
var T={
  title:"HYPERCAT AI",
  petDefault:"小橘",
  replyDefault:"你好！我是你的 AI 萌宠。",
  pet:"摸摸",
  think:"思考",
  rest:"休息",
  thinking:"正在思考",
  idle:"待机中",
  happy:"很开心",
  sleepy:"休息一下",
  sad:"有点难过",
  curious:"好奇中"
};

/* BASE uses the actual Xiaomi 17 Pro rear display resolution. */
var BASE_W=904,BASE_H=572,BASE_CAM=Math.floor(BASE_W/3);
var FRAME_RATE=30,FRAME_MS=1000/FRAME_RATE;
var AVAIL={x:BASE_CAM+20,y:20,w:BASE_W-BASE_CAM-40,h:BASE_H-40};
var LAYOUT=Object.freeze({
  OUTER:{x:AVAIL.x,y:AVAIL.y,w:AVAIL.w,h:AVAIL.h},
  OUTER_RADIUS:28,
  HEADER:{x:Math.round(AVAIL.x+AVAIL.w*.04),y:Math.round(AVAIL.y+AVAIL.h*.04),w:Math.round(AVAIL.w*.92),h:Math.round(AVAIL.h*.12)},
  FACE:{x:Math.round(AVAIL.x+AVAIL.w*.10),y:Math.round(AVAIL.y+AVAIL.h*.22),w:Math.round(AVAIL.w*.80),h:Math.round(AVAIL.h*.49)},
  REPLY:{x:Math.round(AVAIL.x+AVAIL.w*.04),y:Math.round(AVAIL.y+AVAIL.h*.75),w:Math.round(AVAIL.w*.92),h:Math.round(AVAIL.h*.08)},
  REPLY_RULE_HEIGHT:1,
  REPLY_TEXT_TOP:8,
  REPLY_LINE_SPACING:18,
  BUTTON_RADIUS:18,
  BUTTONS:[
    {x:Math.round(AVAIL.x+AVAIL.w*.076),y:Math.round(AVAIL.y+AVAIL.h*.86),w:130,h:60,label:T.pet,mood:1},
    {x:Math.round(AVAIL.x+AVAIL.w*.386),y:Math.round(AVAIL.y+AVAIL.h*.86),w:130,h:60,label:T.think,mood:2},
    {x:Math.round(AVAIL.x+AVAIL.w*.696),y:Math.round(AVAIL.y+AVAIL.h*.86),w:130,h:60,label:T.rest,mood:3}
  ],
  CHILD:{x:Math.round(AVAIL.x+AVAIL.w*.04),y:Math.round(AVAIL.y+AVAIL.h*.04),w:Math.round(AVAIL.w*.92),h:Math.round(AVAIL.h*.934)}
});
var canvas=document.getElementById("rear"),ctx=canvas.getContext("2d",{alpha:false});
var W=0,H=0,dpr=1,CAM=0,FIT=1,DX=0,DY=0;
var rafPend=false,paused=false,lastDraw=-1e9,lastFrame=0,animTime=0,dead=false;
var mood=0,localMoodUntil=0,blink=0,blinkAt=0,nextBlink=1900,gazeX=0,gazeY=0,petEmoji="🐱";
var pointerId=null,pressStartedAt=0,pressAction="",DEMO_T=1200,petName=T.petDefault,agentReply=T.replyDefault,projectionEnabled=false;
var fontCache=Object.create(null);
var moods=[
  {name:T.idle,eye:1,pupil:1,mouth:0},
  {name:T.happy,eye:.64,pupil:1,mouth:1},
  {name:T.thinking,eye:.9,pupil:.82,mouth:2},
  {name:T.sleepy,eye:.22,pupil:.35,mouth:3},
  {name:T.sad,eye:.78,pupil:.9,mouth:4}
];

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function now(){return Date.now();}
function getFont(weight,size){var n=Math.max(12,Math.floor(size)),key=weight+":"+n;return fontCache[key]||(fontCache[key]=weight+" "+n+"px system-ui,sans-serif");}
function fitFont(value,maxWidth,baseSize,weight){var size=Math.floor(baseSize);while(size>12){ctx.font=getFont(weight,size);if(ctx.measureText(String(value)).width<=maxWidth)break;size--;}return getFont(weight,Math.max(12,size));}
function syncMamlState(){
  try{
    var bridge=window.maml;if(!bridge||typeof bridge.getStringByName!=="function")return;
    var n=bridge.getStringByName("petName");if(n&&n!=="undefined")petName=String(n).slice(0,16);
    var em=bridge.getStringByName("petEmoji");if(em&&em!=="undefined")petEmoji=String(em).slice(0,8);
    var r=bridge.getStringByName("reply");if(r&&r!=="undefined")agentReply=String(r).slice(0,100);
    var enabledRaw=bridge.getStringByName("enabled");
    if(enabledRaw&&enabledRaw!=="undefined")projectionEnabled=String(enabledRaw).toLowerCase()==="true"||String(enabledRaw)==="1";
    canvas.style.visibility=projectionEnabled?"visible":"hidden";
    var raw=bridge.getStringByName("mood");if(raw&&raw!=="undefined"&&now()>=localMoodUntil){
      var key=String(raw).toLowerCase(),map={normal:0,idle:0,happy:1,thinking:2,sleepy:3,sad:4,surprised:1};
      if(Object.prototype.hasOwnProperty.call(map,key))mood=map[key];
    }
  }catch(_){}
}
function dispatchRearAction(action,nextMood){
  if(!projectionEnabled)return;
  setMoodIndex(nextMood,false);localMoodUntil=now()+4000;
  try{if(window.maml&&typeof window.maml.doAction==="function")window.maml.doAction(action);}catch(_){}
}
function kick(){if(dead||paused||window.__DIAL_NO_ANIM||rafPend)return;rafPend=true;requestAnimationFrame(frame);}
function __fit(){
  dpr=window.devicePixelRatio||1;
  W=window.CANVAS_W||window.innerWidth||canvas.clientWidth||BASE_W;
  H=window.CANVAS_H||window.innerHeight||canvas.clientHeight||BASE_H;
  var bw=Math.round(W*dpr),bh=Math.round(H*dpr);
  if(canvas.width!==bw)canvas.width=bw;
  if(canvas.height!==bh)canvas.height=bh;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CAM=Math.floor(W/3);
  FIT=Math.min((W-CAM)/(BASE_W-BASE_CAM),H/BASE_H);
  DX=Math.round((CAM+(W-CAM)/2)-((BASE_CAM+BASE_W)/2)*FIT);
  DY=Math.round((H-BASE_H*FIT)/2);
  window.__DIAL_CANVAS_SIZE={width:W,height:H};
  if(window.__DIAL_NO_ANIM){setupDemo();draw(DEMO_T);return;}
  if(!paused){lastDraw=-1e9;kick();}
}
function setMoodIndex(value,fromAgent){
  var next=clamp(Math.round(Number(value)||0),0,moods.length-1);
  if(fromAgent!==false&&now()<localMoodUntil)return;
  mood=next;
  if(mood===1){blink=0;}
  kick();
}
function __setMoodIndex(value){setMoodIndex(value,true);}
function __setAod(value){
  var next=Number(value)===1;
  if(next===paused)return;
  paused=next;
  if(paused)return;
  lastDraw=-1e9;
  lastFrame=now();
  kick();
}
function __debugSize(){return [W,H,dpr,canvas.width,canvas.height,FIT].join(" ");}
function setupDemo(){mood=1;blink=0;gazeX=0;gazeY=0;animTime=DEMO_T;nextBlink=1900;}
function roundedRect(x,y,w,h,r){
  r=clamp(Number.isFinite(r)?r:0,0,Math.min(w,h)/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawEye(x,y,w,h,blinkAmount,pupilScale){
  var eh=Math.max(2,h*(1-blinkAmount*.94));
  ctx.save();ctx.fillStyle="#7de5ff";
  ctx.beginPath();ctx.ellipse(x,y,w/2,eh/2,0,0,Math.PI*2);ctx.fill();
  if(pupilScale>.05&&blinkAmount<.72){
    var pr=Math.min(w,eh)*.30*pupilScale,px=x+gazeX*w*.12,py=y+gazeY*h*.08;
    ctx.fillStyle="#06182b";ctx.beginPath();ctx.ellipse(px,py,pr*.82,pr,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px-pr*.25,py-pr*.34,Math.max(2,pr*.2),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawFace(t){
  var f=LAYOUT.FACE,cx=f.x+f.w/2,cy=f.y+f.h*.48;
  var e=moods[mood]||moods[0],eyeW=f.w*.205,eyeH=f.h*.39,gap=f.w*.245;
  var breath=window.__DIAL_NO_ANIM?0:Math.sin(t/900)*.012;
  var eyeY=cy+f.h*breath;
  var pulse=mood===1&&!window.__DIAL_NO_ANIM?1+Math.sin(t/230)*.025:1;
  eyeW*=pulse;eyeH*=pulse;
  /* Minimal ears and cheek marks, all coordinates derive from FACE. */
  ctx.save();ctx.lineWidth=4;ctx.strokeStyle="#5bdcff";ctx.fillStyle="rgba(28,153,205,.10)";
  ctx.beginPath();ctx.moveTo(cx-gap-eyeW*.46,cy-eyeH*.52);ctx.lineTo(cx-gap-eyeW*.36,cy-eyeH*.95);ctx.lineTo(cx-gap+eyeW*.02,cy-eyeH*.62);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+gap+eyeW*.46,cy-eyeH*.52);ctx.lineTo(cx+gap+eyeW*.36,cy-eyeH*.95);ctx.lineTo(cx+gap-eyeW*.02,cy-eyeH*.62);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
  var blinkValue=blink;
  drawEye(cx-gap,eyeY,eyeW,eyeH,blinkValue,e.pupil);
  drawEye(cx+gap,eyeY,eyeW,eyeH,blinkValue,e.pupil);
  var noseY=eyeY+eyeH*.68,nose=f.w*.018;
  ctx.fillStyle="#7de7ff";ctx.beginPath();ctx.moveTo(cx-nose,noseY-nose*.15);ctx.quadraticCurveTo(cx,noseY-nose, cx+nose,noseY-nose*.15);ctx.quadraticCurveTo(cx,noseY+nose*.85,cx-nose,noseY-nose*.15);ctx.fill();
  ctx.strokeStyle="#75ddff";ctx.lineWidth=4;ctx.lineCap="round";ctx.beginPath();
  if(e.mouth===1){ctx.moveTo(cx-f.w*.055,noseY+f.h*.055);ctx.quadraticCurveTo(cx,noseY+f.h*.14,cx+f.w*.055,noseY+f.h*.055);}
  else if(e.mouth===2){ctx.moveTo(cx-f.w*.035,noseY+f.h*.07);ctx.lineTo(cx+f.w*.035,noseY+f.h*.07);}
  else if(e.mouth===3){ctx.moveTo(cx-f.w*.035,noseY+f.h*.07);ctx.lineTo(cx+f.w*.035,noseY+f.h*.07);}
  else if(e.mouth===4){ctx.moveTo(cx-f.w*.05,noseY+f.h*.12);ctx.quadraticCurveTo(cx,noseY+f.h*.045,cx+f.w*.05,noseY+f.h*.12);}
  else{ctx.moveTo(cx-f.w*.045,noseY+f.h*.075);ctx.quadraticCurveTo(cx,noseY+f.h*.10,cx+f.w*.045,noseY+f.h*.075);}
  ctx.stroke();
  if(mood===1){
    ctx.fillStyle="rgba(255,117,164,.24)";
    ctx.beginPath();ctx.ellipse(cx-gap*1.55,noseY+f.h*.09,f.w*.045,f.h*.025,0,0,Math.PI*2);
    ctx.ellipse(cx+gap*1.55,noseY+f.h*.09,f.w*.045,f.h*.025,0,0,Math.PI*2);ctx.fill();
  }
}
function drawButton(b,active,t){
  ctx.save();
  roundedRect(b.x,b.y,b.w,b.h,LAYOUT.BUTTON_RADIUS);
  ctx.fillStyle=active?"#103b50":"#081b28";ctx.fill();
  ctx.strokeStyle=active?"#65dcff":"#20465a";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#d7f7ff";ctx.font=getFont("bold",21);ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2);
  ctx.restore();
}
function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(DX,DY);ctx.scale(FIT,FIT);
  /* OUTER is the mandatory backing plate for the usable right-hand display. */
  roundedRect(LAYOUT.OUTER.x,LAYOUT.OUTER.y,LAYOUT.OUTER.w,LAYOUT.OUTER.h,LAYOUT.OUTER_RADIUS);
  ctx.fillStyle="#03090e";ctx.fill();ctx.strokeStyle="#102b39";ctx.lineWidth=2;ctx.stroke();
  if(!window.__DIAL_NO_ANIM)syncMamlState();
  ctx.fillStyle="#73dfff";ctx.font=getFont("bold",17);ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText(T.title,LAYOUT.HEADER.x,LAYOUT.HEADER.y+LAYOUT.HEADER.h*.25);
  ctx.fillStyle="#e7f8ff";ctx.font=fitFont(petName,LAYOUT.HEADER.w*.52,18,"bold");
  ctx.fillText(petName,LAYOUT.HEADER.x,LAYOUT.HEADER.y+LAYOUT.HEADER.h*.72);
  ctx.fillStyle="#73dfff";ctx.font=getFont("normal",14);ctx.textAlign="right";
  ctx.fillText((moods[mood]||moods[0]).name,LAYOUT.HEADER.x+LAYOUT.HEADER.w,LAYOUT.HEADER.y+LAYOUT.HEADER.h*.72);
  drawFace(t);
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="112px system-ui,sans-serif";ctx.fillText(petEmoji,LAYOUT.FACE.x+LAYOUT.FACE.w/2,LAYOUT.FACE.y+LAYOUT.FACE.h*.53);ctx.restore();
  ctx.fillStyle="#31566b";ctx.fillRect(LAYOUT.REPLY.x,LAYOUT.REPLY.y,LAYOUT.REPLY.w,LAYOUT.REPLY_RULE_HEIGHT);
  ctx.fillStyle="#a8d7e8";ctx.font=getFont("normal",14);ctx.textAlign="left";ctx.textBaseline="top";
  var replyText=String(agentReply||"").replace(/\s+/g," "),replyLines=[],current="";
  Array.from(replyText).forEach(function(ch){var candidate=current+ch;if(ctx.measureText(candidate).width>LAYOUT.REPLY.w&&current){replyLines.push(current);current=ch;}else current=candidate;});
  if(current)replyLines.push(current);
  if(replyLines.length>2){replyLines=replyLines.slice(0,2);replyLines[1]=replyLines[1].slice(0,Math.max(0,replyLines[1].length-1))+"…";}
  replyLines.slice(0,2).forEach(function(line,i){ctx.fillText(line,LAYOUT.REPLY.x,LAYOUT.REPLY.y+LAYOUT.REPLY_TEXT_TOP+i*LAYOUT.REPLY_LINE_SPACING);});
  LAYOUT.BUTTONS.forEach(function(b,i){drawButton(b,mood===b.mood,t);});
  if(window.__DIAL_NO_ANIM){
    ctx.save();ctx.strokeStyle="#ff3b3b";ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.strokeRect(0,0,BASE_CAM,BASE_H);ctx.restore();
  }
  ctx.restore();
}
function frame(){
  rafPend=false;
  if(paused||dead||window.__DIAL_NO_ANIM)return;
  if(document.hidden){kick();return;}
  var t=now();
  if(t-lastDraw<FRAME_MS){kick();return;}
  var dt=clamp(t-(lastFrame||t),0,200);
  lastFrame=t;lastDraw=t;animTime+=dt;
  if(blink===0&&animTime>=nextBlink&&mood!==3){blink=1;blinkAt=animTime;nextBlink=animTime+1900+(Math.random()*2600);}
  if(blink>0){var p=(animTime-blinkAt)/180;blink=p<.5?p*2:Math.max(0,1-(p-.5)*2);if(p>=1)blink=0;}
  draw(animTime);
  kick();
}
function pointFromEvent(e){
  var r=canvas.getBoundingClientRect();
  var vx=(e.clientX-r.left)*(W/r.width),vy=(e.clientY-r.top)*(H/r.height);
  return {x:(vx-DX)/FIT,y:(vy-DY)/FIT};
}
function hit(b,p){var pad=12;return p.x>=b.x-pad&&p.x<=b.x+b.w+pad&&p.y>=b.y-pad&&p.y<=b.y+b.h+pad;}
function handlePointer(e){
  if(pointerId!==null&&e.pointerId!==pointerId)return;
  var p=pointFromEvent(e);
  if(e.type==="pointerdown"){
    e.preventDefault();pointerId=e.pointerId;pressStartedAt=now();pressAction="";
    try{canvas.setPointerCapture(pointerId);}catch(_){}
    gazeX=clamp((p.x-(LAYOUT.FACE.x+LAYOUT.FACE.w/2))/(LAYOUT.FACE.w/2),-1,1);
    gazeY=clamp((p.y-(LAYOUT.FACE.y+LAYOUT.FACE.h/2))/(LAYOUT.FACE.h/2),-1,1);
    if(hit(LAYOUT.FACE,p)){pressAction="pet_touch";}
    else{
      LAYOUT.BUTTONS.forEach(function(b){if(hit(b,p)){pressAction=b.mood===1?"pet_touch":b.mood===2?"pet_thinking":"pet_rest";}});
    }
    if(pressAction==="pet_touch")setMoodIndex(1,false);
    else if(pressAction==="pet_thinking")setMoodIndex(2,false);
    else if(pressAction==="pet_rest")setMoodIndex(3,false);
    draw(animTime);
  }else if(e.type==="pointermove"){
    e.preventDefault();
    if(pointerId!==null){
      gazeX=clamp((p.x-(LAYOUT.FACE.x+LAYOUT.FACE.w/2))/(LAYOUT.FACE.w/2),-1,1);
      gazeY=clamp((p.y-(LAYOUT.FACE.y+LAYOUT.FACE.h/2))/(LAYOUT.FACE.h/2),-1,1);
    }
  }else if(e.type==="pointerup"){
    e.preventDefault();
    if(pressAction){
      var longPress=pressAction==="pet_touch"&&now()-pressStartedAt>=650;
      var action=longPress?"pet_long_press":pressAction;
      var nextMood=action==="pet_rest"?3:action==="pet_thinking"?2:1;
      dispatchRearAction(action,nextMood);
    }
    pointerId=null;pressStartedAt=0;pressAction="";gazeX=0;gazeY=0;
  }else if(e.type==="pointercancel"){
    pointerId=null;pressStartedAt=0;pressAction="";gazeX=0;gazeY=0;
  }
}
canvas.addEventListener("pointerdown",handlePointer,{passive:false});
canvas.addEventListener("pointermove",handlePointer,{passive:false});
canvas.addEventListener("pointerup",handlePointer,{passive:false});
canvas.addEventListener("pointercancel",handlePointer,{passive:false});
canvas.addEventListener("contextmenu",function(e){e.preventDefault();});
window.addEventListener("resize",__fit);
document.addEventListener("visibilitychange",function(){if(document.hidden)return;if(!paused&&!window.__DIAL_NO_ANIM)kick();});
window.__fit=__fit;
window.__setAod=__setAod;
window.__debugSize=__debugSize;
window.__setMoodIndex=__setMoodIndex;
window.__setPetState=function(nextMood){__setMoodIndex(nextMood);};
window.__DIAL_NO_ANIM=!!window.__DIAL_NO_ANIM;
if(window.__DIAL_NO_ANIM){__fit();}
else{__fit();lastFrame=now();kick();}
}());
</script>
</body>
</html>
