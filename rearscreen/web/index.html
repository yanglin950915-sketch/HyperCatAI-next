<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101522">
<title>HyperCat AI Live2D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#live2d-stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;display:block;touch-action:none}
/* Keep diagnostics in the lower safe zone, away from the rear-camera cutout. */
#load-error{display:none;position:fixed;z-index:2147483647;left:6%;right:6%;bottom:5%;max-height:30%;overflow:auto;padding:12px 15px;border:1px solid rgba(255,170,180,.65);border-radius:12px;background:rgba(10,14,24,.96);color:#ffe2e6;font:12px/1.45 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}
#load-error strong{display:block;font-size:14px;margin-bottom:4px;color:#ffb8c2}
#load-error-detail{margin-top:4px}
#load-error .hint{margin-top:5px;color:#b8c6d8}
</style>
</head>
<body>
<div id="load-error" role="alert"><strong>虚拟形象加载失败</strong><div id="load-error-detail"></div><div class="hint">诊断信息位于屏幕下方，避开摄像头区域。</div></div>
<!-- SAFE_ZONE: BASE_CAM=301 | OUTER.x=321 OK | HEADER.x=344 OK | FACE.x=377 OK | REPLY.x=344 OK | BUTTONS.x=364/538/713 OK | CHILD.x=344 OK | max_x=862 <= 884 OK -->
<!-- AVAIL: 563x532 ratio=1.06 | OUTER 563x532 fill=100% | CHILD 518x497 fillW=92.01% fillH=93.42% ratio=1.04 deviation=1.5% OK -->
<!-- TOUCH: FACE 450x261 OK | PET 130x60 OK | THINK 130x60 OK | REST 130x60 OK | gaps=44/45px, hitPad=12px, effectiveGap>=20px OK -->
<script>
(function(){
"use strict";
var BASE_W=976,BASE_H=596;
var live2dFrame=null;
var rearState={name:"小橘",avatar:"",mood:"idle",reply:"你好！我是你的 AI 虚拟形象。",backgroundColor:"#101522"};
function applyAgentState(name,avatar,mood,reply,bgColor){
  if(name&&name!=="undefined")rearState.name=String(name);
  if(avatar&&avatar!=="undefined")rearState.avatar=String(avatar);
  if(mood&&mood!=="undefined")rearState.mood=String(mood);
  if(reply&&reply!=="undefined")rearState.reply=String(reply);
  if(bgColor&&/^#[0-9a-fA-F]{6}$/.test(String(bgColor)))rearState.backgroundColor=String(bgColor);
  if(live2dFrame&&live2dFrame.contentWindow)live2dFrame.contentWindow.postMessage({type:"hypercat-agent-state",state:rearState},"*");
}
function applyAgentJson(json){try{var d=typeof json==="string"?JSON.parse(json):json;if(d)applyAgentState(d.avatar_name,d.avatar_id,d.mood,d.reply,d.background_color);}catch(e){}}
function syncMamlState(){
  try{var bridge=window.maml;if(!bridge||typeof bridge.getStringByName!=="function")return;
    applyAgentState(bridge.getStringByName("avatarName"),bridge.getStringByName("avatarId"),bridge.getStringByName("mood"),bridge.getStringByName("reply"),bridge.getStringByName("backgroundColor"));
  }catch(e){}
}
function showLoadError(message){var panel=document.getElementById("load-error"),detail=document.getElementById("load-error-detail");if(detail)detail.textContent=String(message||"未知错误");if(panel)panel.style.display="block";console.error("Rear Live2D failed:",String(message||"unknown"));}
window.__onRearLive2DReady=function(){var panel=document.getElementById("load-error");if(panel)panel.style.display="none";console.log("Rear Live2D ready");};
window.__onRearLive2DError=showLoadError;
window.__setAgentState=applyAgentState;
window.__setAgentJson=applyAgentJson;
window.__fit=function(){if(live2dFrame)live2dFrame.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;";};
window.__setAod=function(value){if(live2dFrame&&live2dFrame.contentWindow)live2dFrame.contentWindow.postMessage({type:"hypercat-aod",value:value},"*");};
window.__debugSize=function(){return [window.innerWidth,window.innerHeight,window.devicePixelRatio||1].join(" ");};
window.__setMoodIndex=function(value){applyAgentState(null,null,["idle","happy","thinking","sleepy","sad","surprised"][Math.max(0,Math.min(5,Number(value)||0))]);};
var marker=document.createElement("script");
marker.src="models/active/model-entry.js";
marker.onload=function(){
  var info=window.HyperCatLive2DModel;
  if(!info||typeof info.entry!=="string"||!info.entry||!info.entry.toLowerCase().endsWith(".model3.json")||info.entry.split("/").indexOf("..")>=0){showLoadError("模型入口文件无效：model-entry.js 未提供有效的 .model3.json 路径");return;}
  var frame=document.createElement("iframe");
  frame.id="live2d-stage";
  frame.title="HyperCat AI Live2D";
  frame.setAttribute("aria-label","Live2D 虚拟形象与交互界面");
  frame.src="live2d/render.html?dir=../models/active/&entry="+encodeURIComponent(info.entry)+"&half=0&safeTop=0.18&fps=30";
  live2dFrame=frame;
  frame.onerror=function(){showLoadError("无法打开 Live2D 渲染页面：web/live2d/render.html");};
  document.body.appendChild(frame);
  syncMamlState();
};
marker.onerror=function(){showLoadError("缺少模型入口：web/models/active/model-entry.js。请重新导出背屏资源包。");};
document.head.appendChild(marker);
setInterval(syncMamlState,500);
window.addEventListener("resize",window.__fit);
window.__rearAction=function(action){try{if(window.maml&&typeof window.maml.doAction==="function")window.maml.doAction(action);}catch(e){}};
}());
</script>
</body>
</html>
