  replyLines.slice(0,2).forEach(function(line,i){ctx.fillText(line,LAYOUT.REPLY.x,LAYOUT.REPLY.y+LAYOUT.REPLY_TEXT_TOP+i*LAYOUT.REPLY_LINE_SPACING);});
  ctx.fillStyle="#56788a";ctx.font=getFont("normal",12);ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("轻触互动  ·  长按聊天  ·  拖动跟随",LAYOUT.REPLY.x+LAYOUT.REPLY.w/2,LAYOUT.REPLY.y+LAYOUT.REPLY.h+18);
  if(window.__DIAL_NO_ANIM){
    ctx.save();ctx.strokeStyle="#ff3b3b";ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.strokeRect(0,0,BASE_CAM,BASE_H);ctx.restore();
  }
  ctx.restore();
}
function frame(){
  rafPend=false;
  if(paused||dead||window.__DIAL_NO_ANIM)return;
  if(document.hidden){kick();return;}
  var t=now();
  if(t-lastDraw<FRAME_MS){kick();return;}
  var dt=clamp(t-(lastFrame||t),0,200);
  lastFrame=t;lastDraw=t;animTime+=dt;
  if(blink===0&&animTime>=nextBlink&&mood!==3){blink=1;blinkAt=animTime;nextBlink=animTime+1900+(Math.random()*2600);}
  if(blink>0){var p=(animTime-blinkAt)/180;blink=p<.5?p*2:Math.max(0,1-(p-.5)*2);if(p>=1)blink=0;}
  draw(animTime);
  kick();
}
function pointFromEvent(e){
  var r=canvas.getBoundingClientRect();
  var vx=(e.clientX-r.left)*(W/r.width),vy=(e.clientY-r.top)*(H/r.height);
  return {x:(vx-DX)/FIT,y:(vy-DY)/FIT};
}
function handlePointer(e){
  if(pointerId!==null&&e.pointerId!==pointerId)return;
  var p=pointFromEvent(e);
  if(e.type==="pointerdown"){
    e.preventDefault();
    if(p.x<LAYOUT.FACE.x-24||p.x>LAYOUT.FACE.x+LAYOUT.FACE.w+24||p.y<LAYOUT.FACE.y-24||p.y>LAYOUT.FACE.y+LAYOUT.FACE.h+24)return;
    pointerId=e.pointerId;pressStartedAt=now();pressAction="avatar_touch";
    pressStartX=p.x;pressStartY=p.y;dragDetected=false;
    try{canvas.setPointerCapture(pointerId);}catch(_){}
    gazeX=clamp((p.x-(LAYOUT.FACE.x+LAYOUT.FACE.w/2))/(LAYOUT.FACE.w/2),-1,1);
    gazeY=clamp((p.y-(LAYOUT.FACE.y+LAYOUT.FACE.h/2))/(LAYOUT.FACE.h/2),-1,1);
    setMoodIndex(1,false);draw(animTime);
  }else if(e.type==="pointermove"){
    e.preventDefault();
    if(pointerId!==null){
      gazeX=clamp((p.x-(LAYOUT.FACE.x+LAYOUT.FACE.w/2))/(LAYOUT.FACE.w/2),-1,1);
      gazeY=clamp((p.y-(LAYOUT.FACE.y+LAYOUT.FACE.h/2))/(LAYOUT.FACE.h/2),-1,1);
      var dx=p.x-pressStartX,dy=p.y-pressStartY;
      if(!dragDetected&&Math.sqrt(dx*dx+dy*dy)>24)dragDetected=true;
      kick();
    }
  }else if(e.type==="pointerup"){
    e.preventDefault();
    if(pressAction){
      var held=now()-pressStartedAt;
      var action=dragDetected?"avatar_drag":held>=650?"avatar_long_press":"avatar_touch";
      dispatchRearAction(action,action==="avatar_long_press"?2:1);
    }
    pointerId=null;pressStartedAt=0;pressAction="";dragDetected=false;gazeX=0;gazeY=0;
  }else if(e.type==="pointercancel"){
    pointerId=null;pressStartedAt=0;pressAction="";dragDetected=false;gazeX=0;gazeY=0;
  }
}
canvas.addEventListener("pointerdown",handlePointer,{passive:false});
canvas.addEventListener("pointermove",handlePointer,{passive:false});
canvas.addEventListener("pointerup",handlePointer,{passive:false});
canvas.addEventListener("pointercancel",handlePointer,{passive:false});
canvas.addEventListener("contextmenu",function(e){e.preventDefault();});
window.addEventListener("resize",__fit);
document.addEventListener("visibilitychange",function(){if(document.hidden)return;if(!paused&&!window.__DIAL_NO_ANIM)kick();});
window.__fit=__fit;
window.__setAod=__setAod;
window.__debugSize=__debugSize;
window.__setMoodIndex=__setMoodIndex;
window.__setAvatarState=function(nextMood){__setMoodIndex(nextMood);};
window.__setAgentState=applyAgentState;
window.__setAgentJson=applyAgentJson;
window.__DIAL_NO_ANIM=!!window.__DIAL_NO_ANIM;
if(window.__DIAL_NO_ANIM){__fit();}
else{__fit();lastFrame=now();kick();}
}());
</script>
