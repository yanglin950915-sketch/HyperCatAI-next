<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Live2D</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden;
               -webkit-tap-highlight-color:transparent; }
  #stage { position:fixed; left:0; top:0; width:100%; height:100%; }
  canvas { display:block; background:transparent; }
  #render-error { display:none; position:fixed; inset:0; z-index:99; box-sizing:border-box; padding:24px; color:#eaf4ff; background:#080d18; font:14px/1.6 system-ui,sans-serif; align-items:center; justify-content:center; text-align:center; overflow-wrap:anywhere; }
  #render-error strong { display:block; margin-bottom:10px; color:#ffb8c2; font-size:17px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="render-error" role="alert"><div><strong>虚拟形象加载失败</strong><span id="render-error-detail">正在检查渲染资源…</span></div></div>
<script src="pixi.min.js"></script>
<script src="live2dcubismcore.min.js"></script>
<script src="cubism4.min.js"></script>
<script>
/*
 * Live2D 渲染宿主页。
 *
 * 与原生侧的契约（原生用 evaluateJavascript 调用，全部挂在 window.__l2d 上）：
 *   __l2d.ready()                -> Boolean   模型是否已加载完成
 *   __l2d.setMouth(v)            v: 0..1      口型开合，由原生按播放中 PCM 的 RMS 推
 *   __l2d.setSpeaking(on)        Boolean      说话中（影响呼吸幅度与身体摆动）
 *   __l2d.setEmotion(name)       String       内置表情名，见 EMOTIONS
 *   __l2d.setGaze(x, y)          -1..1        眼球跟随
 *   __l2d.poke(part)             String       'head' | 'body'，点击互动
 *   __l2d.reset()                              重载模型
 *   回调原生：window.NativeBridge.onReady() / onError(msg) / onPoke(part) / onFps(f)
 *
 * 模型目录通过 URL 参数 dir 传入，例如 render.html?dir=file:///data/user/0/<pkg>/files/models/xxx
 * 该目录下必须存在 model.model3.json（或 name.model3.json）。
 */
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  // Resolve model assets against this document, not the MAML host's working directory.
  // The rear card hosts this renderer directly, without a nested file:// iframe.
  var DIR = new URL(params.get('dir') || '../models/active/', document.baseURI).href;
  if (DIR.charAt(DIR.length - 1) !== '/') DIR += '/';

  // 初始构图由 URL 参数决定，原生侧后续可用 __l2d.setView() 动态切换。
  var VIEW_HALF = params.get('half') === '1';
  var VIEW_RATIO = parseFloat(params.get('ratio') || '0.78');
  // Native rear host supplies a measured safe rectangle around the camera island.
  // All values are normalized to the actual rear-window viewport; main screen defaults to zero.
  function safeRatio(name) {
    var value = parseFloat(params.get(name) || '0');
    return isFinite(value) ? Math.max(0, Math.min(0.95, value)) : 0;
  }
  var SAFE_TOP_RATIO = safeRatio('safeTop');
  var SAFE_LEFT_RATIO = safeRatio('safeLeft');
  var SAFE_RIGHT_RATIO = safeRatio('safeRight');
  var SAFE_BOTTOM_RATIO = safeRatio('safeBottom');
  // The deployed Xiaomi MAML card opens this page directly (without Live2DView URL args).
  // In that path Android DisplayCutout data is unavailable to the WebView, so the
  // camera-island exclusion must use the measured rear-panel layout fallback.
  // The camera island occupies about 31% of the 976px panel. Keep only a small
  // 1% clearance; the previous 38% inset shifted the safe-area centre too far right.
  if (params.get('safeLeft') === null && window.maml) {
    SAFE_LEFT_RATIO = 0.32;
  }
  // Keep the horizontal adjustment isolated to the rear display. The same renderer
  // is also used by the main-screen avatar, which must remain centred.
  var IS_REAR_DISPLAY = params.get('rear') === '1' || !!window.maml;
  var VIEW_OFFSET_X = IS_REAR_DISPLAY ? -0.07 : 0;
  var PORTRAIT_CAPTURED = false;
  // Per-model horizontal correction. Default is zero; only Xiaomi Rice receives a tuned value.
  var MODEL_OFFSET_X = parseFloat(params.get('offsetX') || '0');
  if (!isFinite(MODEL_OFFSET_X)) MODEL_OFFSET_X = 0;

  var NATIVE = window.NativeBridge || window.maml || null;
  function log() {
    console.log.apply(console, arguments);
  }
  function fail(msg) {
    var detail = String(msg || 'unknown error');
    console.error('HyperCat Live2D render failed:', detail);
    // In the rear-card iframe, report to the outer page. Its notice is placed
    // in the lower safe area so the camera cutout cannot cover the diagnosis.
    var embedded = false;
    try { embedded = window.parent && window.parent !== window; } catch (_) {}
    if (embedded) {
      try { if (window.parent.__onRearLive2DError) window.parent.__onRearLive2DError(detail); } catch (_) {}
      var panel = document.getElementById('render-error');
      if (panel) panel.style.display = 'none';
    } else {
      var panel = document.getElementById('render-error');
      var label = document.getElementById('render-error-detail');
      if (label) label.textContent = detail.slice(0, 240);
      if (panel) panel.style.display = 'flex';
    }
    if (NATIVE && NATIVE.onError) NATIVE.onError(detail);
  }

  // 由 PIXI 的 ticker 驱动，但所有可视状态都由原生侧写入，本页只做平滑。
  var model = null;
  var app = null;
  var target = { mouth: 0, speaking: false, musicBeat: 0, gazeX: 0, gazeY: 0 };
  var smooth = { mouth: 0, gazeX: 0, gazeY: 0, angleX: 0, angleY: 0, bodyX: 0, musicBeat: 0, pokeT: -10 };
  var musicBaseY = 0;
  var emotionTimer = 0;
  var emotionOverride = null;
  var emotionPersistent = false;
  var startTs = 0;

  // 构图模式。原生侧通过 __l2d.setView() 写入后立即 relayout。
  var view = {
    halfBody: VIEW_HALF,
    halfBodyRatio: isFinite(VIEW_RATIO) ? Math.max(0.3, Math.min(0.8, VIEW_RATIO)) : 0.48
  };

  // 参数索引在加载后查一次，避免每帧按名字查表。
  var P = {};

  var EMOTIONS = {
    happy:     { ParamEyeLSmile: 1, ParamEyeRSmile: 1, ParamMouthForm: 1, ParamBrowLY: 0.4, ParamBrowRY: 0.4 },
    sad:       { ParamEyeLSmile: 0, ParamEyeRSmile: 0, ParamMouthForm: -0.8, ParamBrowLY: -0.6, ParamBrowRY: -0.6 },
    angry:     { ParamEyeLSmile: 0, ParamEyeRSmile: 0, ParamMouthForm: -0.6, ParamBrowLY: -0.9, ParamBrowRY: -0.9, ParamAngleZ: -8 },
    shy:       { ParamEyeLSmile: 0.6, ParamEyeRSmile: 0.6, ParamMouthForm: 0.4, ParamCheek: 1, ParamBrowLY: 0.2, ParamBrowRY: 0.2 },
    curious:   { ParamEyeLSmile: 0.3, ParamEyeRSmile: 0.3, ParamMouthForm: 0.2, ParamBrowLY: 0.55, ParamBrowRY: 0.55, ParamAngleY: 4 },
    thinking:  { ParamEyeLSmile: 0.1, ParamEyeRSmile: 0.1, ParamMouthForm: -0.1, ParamBrowLY: 0.25, ParamBrowRY: 0.25, ParamAngleY: 5 },
    sleepy:    { ParamEyeLOpen: 0.25, ParamEyeROpen: 0.25, ParamMouthForm: 0.1 },
    surprised: { ParamEyeLOpen: 1, ParamEyeROpen: 1, ParamMouthOpenY: 0.45, ParamBrowLY: 0.9, ParamBrowRY: 0.9 }
  };

  function pickSettingsFile(entries) {
    // 优先 model.model3.json；否则取目录里唯一的 *.model3.json
    return null;
  }

  function loadModel(dir, entry) {
    PORTRAIT_CAPTURED = false;
    var url = new URL(entry || 'model.model3.json', dir).href;
    log('L2D loading', url);

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'json';
    xhr.onerror = function () { fail('xhr error ' + url); };
    xhr.onload = function () {
      if (xhr.status !== 200 && xhr.status !== 0) { fail('http ' + xhr.status + ' ' + url); return; }
      var json = xhr.response;
      if (!json) { fail('empty settings ' + url); return; }
      try {
        sanitizeSettings(json, dir, url);
      } catch (e) {
        fail('sanitize ' + e); return;
      }
      // 用改写后的 JSON 直接构造，避免再发一次请求（原包 Groups 里 EyeBlink/LipSync 是空数组，
      // pixi-live2d-display 会因此完全不眨眼、不张嘴）。
      var settings = new PIXI.live2d.Cubism4ModelSettings(json);
      PIXI.live2d.Live2DModel.from(settings, { autoInteract: false }).then(function (m) {
        attach(m);
      }).catch(function (e) {
        fail('from ' + e);
      });
    };
    xhr.send();
  }

  /**
   * 修正模型设置：原导出包里 Groups.EyeBlink.Ids 与 Groups.LipSync.Ids 都是空数组，
   * 且没有 Expressions 段。这里按 cdi3 里实际存在的参数名补齐，缺失的组直接删掉，
   * 让 pixi-live2d-display 走自己的默认值。
   */
  function sanitizeSettings(json, dir, selfUrl) {
    // Cubism4ModelSettings 的基类强制要求顶层存在字符串 url，否则直接抛
    // TypeError: The `url` field in settings JSON must be defined as a string.
    // 原导出包没有这个字段，必须自己补。
    // pixi-live2d-display resolves every FileReferences value against json.url.
    // Keep asset paths relative to the model settings file; prefixing them with
    // DIR here makes resolveURL() append the model directory a second time.
    // Resolve the settings URL once so APK assets and rear ZIP-relative paths
    // follow the same URL rules.
    json.url = new URL(selfUrl, document.baseURI).href;
    if (!json.FileReferences) json.FileReferences = {};
    var fr = json.FileReferences;
    var modelDirectoryUrl = new URL('.', json.url).href;

    // Resolve every model-relative asset to a complete file URL before handing
    // settings to Cubism. This avoids differences between MAML WebView and the
    // app WebView URL resolvers, and prevents accidental directory duplication.
    function abs(p) {
      if (!p) return p;
      var normalized = String(p).split(String.fromCharCode(92)).join('/');
      if (normalized.indexOf('://') >= 0 || normalized.charAt(0) === '/' ||
          normalized.split('/').indexOf('..') >= 0) {
        throw new Error('model asset path escapes its imported directory: ' + normalized);
      }
      var resolved = new URL(normalized, json.url).href;
      if (resolved.indexOf(modelDirectoryUrl) !== 0) {
        throw new Error('model asset resolved outside its package: ' + resolved);
      }
      return resolved;
    }
    if (fr.Moc) fr.Moc = abs(fr.Moc);
    if (fr.Physics) fr.Physics = abs(fr.Physics);
    if (fr.DisplayInfo) fr.DisplayInfo = abs(fr.DisplayInfo);
    if (fr.Pose) fr.Pose = abs(fr.Pose);
    if (fr.Textures) for (var i = 0; i < fr.Textures.length; i++) fr.Textures[i] = abs(fr.Textures[i]);
    if (fr.Expressions) for (var j = 0; j < fr.Expressions.length; j++) {
      if (fr.Expressions[j].File) fr.Expressions[j].File = abs(fr.Expressions[j].File);
    }
    if (fr.Motions) {
      for (var g in fr.Motions) {
        for (var k = 0; k < fr.Motions[g].length; k++) {
          var mo = fr.Motions[g][k];
          if (mo.File) mo.File = abs(mo.File);
          if (mo.Sound) mo.Sound = abs(mo.Sound);
        }
      }
    }

    json.Groups = json.Groups || [];
    var names = (json.Groups || []).map(function (g) { return g.Name; });
    function has(n) { return names.indexOf(n) >= 0; }

    if (!has('EyeBlink')) {
      json.Groups.push({ Name: 'EyeBlink', Ids: ['ParamEyeLOpen', 'ParamEyeROpen'] });
    } else {
      json.Groups.forEach(function (g) {
        if (g.Name === 'EyeBlink' && (!g.Ids || g.Ids.length === 0)) {
          g.Ids = ['ParamEyeLOpen', 'ParamEyeROpen'];
        }
      });
    }
    if (!has('LipSync')) {
      json.Groups.push({ Name: 'LipSync', Ids: ['ParamMouthOpenY'] });
    } else {
      json.Groups.forEach(function (g) {
        if (g.Name === 'LipSync' && (!g.Ids || g.Ids.length === 0)) {
          g.Ids = ['ParamMouthOpenY'];
        }
      });
    }
  }

  function attach(m) {
    model = m;
    app.stage.addChild(model);

    // 不能手动调 internalModel.update：库在 _render() 里已经用
    //   internalModel.update(deltaTime, elapsedTime)
    // 驱动它（第一个参数是「毫秒增量」，第二个是「毫秒累计」）。
    // 之前手写成 update(nowMs, dtMs) 把两个参数传反，累计时间被当成每帧增量
    // 喂给呼吸/摆动相位，于是动作飞快——这就是「抽搐/更快了」的真因。
    // 保持 autoUpdate 默认 true，只把自己的写参数挂在 beforeModelUpdate 上，
    // 它正好在 coreModel.update() 之前触发，时序最稳。
    model.internalModel.on('beforeModelUpdate', onBeforeModelUpdate);

    var core = model.internalModel.coreModel;
    ['ParamAngleX', 'ParamAngleY', 'ParamAngleZ', 'ParamBodyAngleX', 'ParamBreath',
     'ParamEyeLOpen', 'ParamEyeROpen', 'ParamMouthOpenY', 'ParamMouthForm',
     'ParamEyeBallX', 'ParamEyeBallY', 'ParamBrowLY', 'ParamBrowRY', 'ParamCheek',
     'ParamEyeLSmile', 'ParamEyeRSmile'].forEach(function (n) {
      P[n] = core.getParameterIndex(n);
    });
    log('L2D params', JSON.stringify(P));

    layout();
    startTs = performance.now();
    log('L2D_READY drawables=' + (model.internalModel.coreModel.getDrawableCount
      ? model.internalModel.coreModel.getDrawableCount() : '?'));

    if (NATIVE && NATIVE.onReady) NATIVE.onReady();
    try { if (window.parent && window.parent.__onRearLive2DReady) window.parent.__onRearLive2DReady(); } catch (_) {}
    capturePortraitWhenReady();
  }

  /**
   * 按当前画布尺寸摆放模型。两种模式：
   *
   * - 全身（默认）：整体等比缩放到画面内，底部对齐。
   * - 半身：只把「头顶 + 上半身」铺满画面，腿部自然裁到画外。小屏（480×640）
   *   上全身立绘的脸只有 ~60dp 高，表情基本看不清；半身能给到 ~130dp。
   *
   * 必须幂等：`getBounds()` 返回的是**已乘过 scale 的世界坐标**，所以每次测量前
   * 先把 scale 复位成 1、位置归零，否则第二次调用（旋转/切前后台触发 resize）
   * 会把 0.1049 的 scale 当成原始尺寸又放大 ~9.3 倍，屏幕上只剩一坨巨物。
   */
  function layout() {
    if (!model || !app) return;
    var CW = app.renderer.width / app.renderer.resolution;
    var CH = app.renderer.height / app.renderer.resolution;
    if (CW <= 0 || CH <= 0) return;

    model.scale.set(1);
    model.position.set(0, 0);
    var b = model.getBounds();
    if (!(b.width > 0) || !(b.height > 0)) return;

    // Fit and centre the model inside the measured camera-safe rectangle.
    var safeLeft = Math.min(CW * 0.95, Math.max(0, CW * SAFE_LEFT_RATIO));
    var safeRight = Math.min(CW * 0.95, Math.max(0, CW * SAFE_RIGHT_RATIO));
    var safeTop = Math.min(CH * 0.95, Math.max(0, CH * SAFE_TOP_RATIO));
    var safeBottom = Math.min(CH * 0.95, Math.max(0, CH * SAFE_BOTTOM_RATIO));
    var usableW = Math.max(1, CW - safeLeft - safeRight);
    var usableH = Math.max(1, CH - safeTop - safeBottom);
    var s, bounds;
    if (view.halfBody) {
      var ratio = Math.max(0.3, Math.min(0.8, view.halfBodyRatio));
      s = Math.min(usableW / b.width, usableH / (b.height * ratio)) * 0.98;
      model.scale.set(s);
      bounds = model.getBounds();
    } else {
      s = Math.min(usableW / b.width, usableH / b.height) * 0.94;
      model.scale.set(s);
      bounds = model.getBounds();
    }
    model.position.x += safeLeft + (usableW - bounds.width) / 2 - bounds.x;
    model.position.y += safeTop + (usableH - bounds.height) / 2 - bounds.y;
    musicBaseY = model.position.y;
    model.position.x += CW * VIEW_OFFSET_X;
    model.position.x += CW * MODEL_OFFSET_X;

    log('L2D layout canvas=' + CW.toFixed(1) + 'x' + CH.toFixed(1) +
        ' safeRect=' + [safeLeft, safeTop, safeRight, safeBottom].map(function(v){return v.toFixed(1)}).join(',') + ' half=' + view.halfBody +
        ' scale=' + s.toFixed(5) + ' model=' + bounds.width.toFixed(1) +
        'x' + bounds.height.toFixed(1) + ' modelOffsetX=' + MODEL_OFFSET_X.toFixed(4));
  }

  function capturePortraitWhenReady() {
    if (params.get('portrait') !== '1' || PORTRAIT_CAPTURED) return;
    // Export the model's rendered display object to a real canvas. Retry across
    // several completed animation frames: WebGL textures may not be extractable
    // on the very first frame after Cubism reports ready.
    var attempts = 0;
    function capture() {
      if (PORTRAIT_CAPTURED || !model || !app || !NATIVE || !NATIVE.onPortrait) return;
      requestAnimationFrame(function () {
        try {
          var extract = app.renderer && app.renderer.plugins && app.renderer.plugins.extract;
          if (!extract || typeof extract.canvas !== 'function') throw new Error('PIXI canvas extractor unavailable');
          var canvas = extract.canvas(model);
          var ctx = canvas && canvas.getContext ? canvas.getContext('2d', { willReadFrequently: true }) : null;
          if (!ctx || canvas.width < 2 || canvas.height < 2) throw new Error('portrait canvas unavailable');
          var pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          var visible = 0, minChannel = 255, maxChannel = 0;
          for (var py = 0; py < canvas.height; py += 4) {
            for (var px = 0; px < canvas.width; px += 4) {
              var pi = (py * canvas.width + px) * 4;
              if (pixels[pi + 3] > 24) {
                visible++;
                minChannel = Math.min(minChannel, pixels[pi], pixels[pi + 1], pixels[pi + 2]);
                maxChannel = Math.max(maxChannel, pixels[pi], pixels[pi + 1], pixels[pi + 2]);
              }
            }
          }
          var dataUrl = canvas.toDataURL('image/png');
          // Reject blank/white WebGL snapshots; the native UI keeps its stable static
          // fallback rather than briefly showing a bad frame and then losing it.
          if (visible > 40 && maxChannel - minChannel > 8 &&
              dataUrl && dataUrl.indexOf('data:image/png;base64,') === 0 && dataUrl.length > 1500) {
            PORTRAIT_CAPTURED = true;
            NATIVE.onPortrait(dataUrl);
            log('portrait captured', canvas.width + 'x' + canvas.height, 'visible=' + visible);
            return;
          }
          throw new Error('portrait canvas is blank or uniform');
        } catch (e) {
          log('portrait capture attempt ' + (attempts + 1) + ' failed', String(e));
        }
        attempts++;
        if (attempts < 12) setTimeout(capture, 120);
      });
    }
    setTimeout(capture, 520);
  }

  function viewport() {
    // WebView 里 window.innerWidth/innerHeight 是唯一可靠的尺寸来源；documentElement.clientWidth
    // 在某些时序下会给出 0，必须兜底。
    var W = window.innerWidth || document.documentElement.clientWidth || 640;
    var H = window.innerHeight || document.documentElement.clientHeight || 480;
    return { w: W > 0 ? W : 640, h: H > 0 ? H : 480 };
  }

  /**
   * 把 canvas 显式钉成视口像素尺寸。
   *
   * 不能用 `style.width='100%'`：`#stage` 用 `position:absolute; inset:0` 时，在 WebView
   * 里百分比高度会被解析成 0，canvas 于是变成 h=0 的不可见元素（GL 照常渲染、readPixels
   * 有像素，但屏幕上一片空白）。改成 position:fixed + 显式 px 才稳定。
   */
  function applyCanvasSize(W, H) {
    var v = app.view;
    v.style.position = 'fixed';
    v.style.left = '0';
    v.style.top = '0';
    v.style.width = W + 'px';
    v.style.height = H + 'px';
  }

  function initPixi() {
    if (!window.PIXI) throw new Error('PIXI.js 未加载：请检查 web/live2d/pixi.min.js');
    if (!PIXI.live2d || !PIXI.live2d.Live2DModel) throw new Error('Live2D Cubism 插件未加载：请检查 cubism4.min.js');
    if (!document.getElementById('stage')) throw new Error('缺少渲染容器 #stage');
    var vp = viewport();
    var W = vp.w, H = vp.h;
    app = new PIXI.Application({
      width: W, height: H,
      backgroundColor: 0x000000,
      backgroundAlpha: 0,
      antialias: true,
      autoDensity: true,
      resolution: Math.min(window.devicePixelRatio || 1, 3.0),
      clearBeforeRender: true,
      powerPreference: 'high-performance'
    });
    document.getElementById('stage').appendChild(app.view);
    applyCanvasSize(W, H);

    // Keep the requested 60 FPS target. Improve frame pacing without lowering
    // renderer resolution or the ticker's target rate.
    var MAX_FPS = parseFloat(params.get('fps') || '60');
    if (!isFinite(MAX_FPS) || MAX_FPS < 1) MAX_FPS = 60;
    PIXI.Ticker.shared.maxFPS = Math.min(MAX_FPS, 60);
    // Clamp unusually large animation deltas after a transient GPU stall.
    PIXI.Ticker.shared.minFPS = 30;
    log('L2D fps cap=' + MAX_FPS);

    // 只做 FPS 统计；参数写入全部交给 onBeforeModelUpdate。
    var fpsAcc = 0, fpsLast = 0;
    PIXI.Ticker.shared.add(function () {
      if (!model) return;
      fpsAcc++;
      var now = performance.now();
      if (now - fpsLast > 1000) {
        if (fpsLast > 0) {
          var fps = Math.round(fpsAcc * 1000 / (now - fpsLast));
          if (NATIVE && NATIVE.onFps) NATIVE.onFps(fps);
        }
        fpsAcc = 0;
        fpsLast = now;
      }
    });
  }

  /**
   * 每帧写参数。由 internalModel 的 `beforeModelUpdate` 事件驱动，
   * 时序是 motion/expression/eyeblink 之后、`coreModel.update()` 之前，
   * 正是官方推荐的「外部覆盖参数」位置。
   */
  function onBeforeModelUpdate() {
    if (!model) return;
    var t = (performance.now() - startTs) / 1000;
    var core = model.internalModel.coreModel;

    // 平滑：口型快跟，视线慢跟，避免抖动。
    var mouthTarget = target.speaking && target.mouth < 0.01 ? (0.10 + Math.max(0, Math.sin(t * 10.5)) * 0.42) : target.mouth;
    smooth.mouth += (mouthTarget - smooth.mouth) * 0.45;
    smooth.gazeX += (target.gazeX - smooth.gazeX) * 0.08;
    smooth.gazeY += (target.gazeY - smooth.gazeY) * 0.08;

    // 呼吸与轻微待机摆动由代码驱动（模型没有 motion3 文件）。
    smooth.musicBeat += (target.musicBeat - smooth.musicBeat) * 0.32;
    var beatPulse = Math.max(0, (smooth.musicBeat - 0.18) / 0.82);
    var breathAmp = target.speaking ? 0.9 : (beatPulse > 0 ? 0.95 : 0.55);
    model.position.y = musicBaseY - beatPulse * 8;
    if (P.ParamBreath >= 0) core.setParameterValueByIndex(P.ParamBreath, 0.35 + Math.sin(t * 1.3) * 0.25 * breathAmp);
    if (P.ParamBodyAngleX >= 0) core.setParameterValueByIndex(P.ParamBodyAngleX, Math.sin(t * 0.7) * 4 + smooth.mouth * 1.5 + beatPulse * Math.sin(t * 13) * 3.2);
    if (P.ParamAngleZ >= 0) core.setParameterValueByIndex(P.ParamAngleZ, Math.sin(t * 0.5) * 3 + beatPulse * Math.sin(t * 13) * 2.8);
    if (P.ParamAngleY >= 0) core.setParameterValueByIndex(P.ParamAngleY, Math.sin(t * 0.9) * 2.5);
    if (P.ParamAngleX >= 0) core.setParameterValueByIndex(P.ParamAngleX, Math.sin(t * 0.35) * 3 + smooth.gazeX * 6);
    if (P.ParamEyeBallX >= 0) core.setParameterValueByIndex(P.ParamEyeBallX, smooth.gazeX);
    if (P.ParamEyeBallY >= 0) core.setParameterValueByIndex(P.ParamEyeBallY, smooth.gazeY);

    if (P.ParamMouthOpenY >= 0) {
      core.setParameterValueByIndex(P.ParamMouthOpenY, Math.max(0, Math.min(1, smooth.mouth)));
    }
    if (P.ParamMouthForm >= 0 && emotionOverride === null) {
      core.setParameterValueByIndex(P.ParamMouthForm, target.speaking ? 0.15 : 0.3);
    }

    // 点击反馈：被戳后短时间内往前倾一下。
    var sincePoke = t - smooth.pokeT;
    if (sincePoke >= 0 && sincePoke < 0.45) {
      var k = Math.sin((sincePoke / 0.45) * Math.PI);
      if (P.ParamAngleZ >= 0) core.setParameterValueByIndex(P.ParamAngleZ, Math.sin(t * 0.5) * 3 + k * 9);
      if (P.ParamAngleY >= 0) core.setParameterValueByIndex(P.ParamAngleY, k * -6);
    }

    // 表情覆盖：持续 1.6 秒后自动淡出。
    if (emotionOverride) {
      var age = t - emotionTimer;
      if (!emotionPersistent && age > 1.6) {
        emotionOverride = null;
      } else {
        var fade = emotionPersistent ? 1 : (age > 1.1 ? (1.6 - age) / 0.5 : 1);
        for (var name in emotionOverride) {
          var idx = P[name];
          if (idx !== undefined && idx >= 0) {
            core.setParameterValueByIndex(idx, emotionOverride[name] * fade);
          }
        }
      }
    }
  }

  // Explicitly release the old WebGL scene before this WebView navigates to a
  // newly selected character. Reusing the native WebView avoids a cold Chromium
  // startup; disposing the previous PIXI scene prevents stale frames/GL resources.
  function disposeRenderer() {
    try {
      if (model && model.internalModel) model.internalModel.off('beforeModelUpdate', onBeforeModelUpdate);
    } catch (_) {}
    try {
      if (PIXI && PIXI.Ticker && PIXI.Ticker.shared) PIXI.Ticker.shared.stop();
    } catch (_) {}
    try {
      if (app) app.destroy(true, { children: true, texture: false, baseTexture: false });
    } catch (e) { log('renderer dispose', String(e)); }
    model = null;
    app = null;
  }
  window.addEventListener('pagehide', disposeRenderer, { once: true });
  window.addEventListener('beforeunload', disposeRenderer, { once: true });

  function onResize() {
    if (!app) return;
    var vp = viewport();
    if (vp.w <= 0 || vp.h <= 0) return;
    app.renderer.resize(vp.w, vp.h);
    applyCanvasSize(vp.w, vp.h);
    layout();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });

  // 直接触摸角色：轻触、长按、拖动分别反馈给 Agent。
  var pointerStart = null;
  window.addEventListener('pointerdown', function (ev) {
    pointerStart = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, at: performance.now(), moved: false };
    try { ev.target.setPointerCapture(ev.pointerId); } catch (_) {}
    target.gazeX = Math.max(-1, Math.min(1, (ev.clientX / Math.max(1, window.innerWidth) - .5) * 2));
    target.gazeY = Math.max(-1, Math.min(1, (ev.clientY / Math.max(1, window.innerHeight) - .5) * 2));
    smooth.pokeT = (performance.now() - startTs) / 1000;
  }, { passive: true });
  window.addEventListener('pointermove', function (ev) {
    if (!pointerStart || pointerStart.id !== ev.pointerId) return;
    var dx = ev.clientX - pointerStart.x, dy = ev.clientY - pointerStart.y;
    if (Math.sqrt(dx * dx + dy * dy) > 24) pointerStart.moved = true;
    target.gazeX = Math.max(-1, Math.min(1, (ev.clientX / Math.max(1, window.innerWidth) - .5) * 2));
    target.gazeY = Math.max(-1, Math.min(1, (ev.clientY / Math.max(1, window.innerHeight) - .5) * 2));
  }, { passive: true });
  function finishPointer(ev) {
    if (!pointerStart || pointerStart.id !== ev.pointerId) return;
    var elapsed = performance.now() - pointerStart.at;
    var part = (pointerStart.y / Math.max(1, window.innerHeight)) < .48 ? 'head' : 'body';
    var action = pointerStart.moved ? 'avatar_drag' : (elapsed >= 520 ? 'avatar_long_press' : 'avatar_touch');
    pointerStart = null;
    if (NATIVE && NATIVE.onGesture) NATIVE.onGesture(action, part);
    else if (NATIVE && NATIVE.doAction) NATIVE.doAction(action);
    else if (NATIVE && NATIVE.onPoke) NATIVE.onPoke(part);
    else {
      try { var bridge=window.parent&&window.parent.maml; if(bridge&&typeof bridge.doAction==='function')bridge.doAction(action); } catch (_) {}
    }
  }
  window.addEventListener('pointerup', finishPointer, { passive: true });
  window.addEventListener('pointercancel', function () { pointerStart = null; }, { passive: true });

  // ---- Live2D 原生界面层：所有画面元素均由同一个 PIXI/Live2D 场景渲染 ----
  // ---- 原生接口 ----
  window.__l2d = {
    ready: function () { return !!model; },
    setMouth: function (v) { target.mouth = Math.max(0, Math.min(1, v || 0)); },
    setSpeaking: function (on) { target.speaking = !!on; },
    setMusicBeat: function (v) { target.musicBeat = Math.max(0, Math.min(1, Number(v) || 0)); },
    setGaze: function (x, y) { target.gazeX = Math.max(-1, Math.min(1, x || 0)); target.gazeY = Math.max(-1, Math.min(1, y || 0)); },
    /**
     * 切换构图：半身（只留头与上半身）或全身。
     * @param {boolean} halfBody
     * @param {number} [ratio] 半身时占满画面的身高比例，0.3–0.8，默认 0.48
     */
    setView: function (halfBody, ratio) {
      view.halfBody = !!halfBody;
      if (typeof ratio === 'number' && isFinite(ratio)) {
        view.halfBodyRatio = Math.max(0.3, Math.min(0.8, ratio));
      }
      layout();
      return { halfBody: view.halfBody, ratio: view.halfBodyRatio };
    },
    setEmotion: function (name) {
      var e = EMOTIONS[name];
      if (!e) { emotionOverride = null; emotionPersistent = false; return; }
      emotionOverride = e;
      emotionPersistent = true;
      emotionTimer = (performance.now() - startTs) / 1000;
    },
    poke: function (part) {
      smooth.pokeT = (performance.now() - startTs) / 1000;
      if (NATIVE && NATIVE.onPoke) NATIVE.onPoke(part || 'body');
      return true;
    },
    reset: function () { location.reload(); }
  };

  // MAML lifecycle and Agent commands now execute in this same WebView.
  // This replaces the old outer-page/inner-iframe bridge.
  function applyAgentState(name, avatar, mood, reply) {
    // The renderer no longer draws the legacy title/status/reply overlay.
    // Keep only the Agent-to-Live2D expression bridge.
    if (!mood || mood === 'undefined') return;
    var key = String(mood).toLowerCase();
    var expressions = {happy:'happy',thinking:'thinking',curious:'curious',sleepy:'sleepy',sad:'sad',surprised:'surprised'};
    if (expressions[key] && window.__l2d) window.__l2d.setEmotion(expressions[key]);
  }
  window.__setAgentState = applyAgentState;
  window.__setAgentJson = function (value) {
    try {
      var data = typeof value === 'string' ? JSON.parse(value) : value;
      if (data) applyAgentState(data.avatar_name, data.avatar_id, data.mood, data.reply);
    } catch (error) { log('MAML state JSON', String(error)); }
  };
  window.__fit = function () { onResize(); };
  window.__setAod = function (value) {
    var active = value === true || value === 1 || value === '1';
    document.body.style.backgroundColor = active ? '#000000' : 'transparent';
    var stage = document.getElementById('stage');
    if (stage) stage.style.backgroundColor = active ? '#000000' : 'transparent';
  };
  window.__debugSize = function () {
    return [window.innerWidth, window.innerHeight, window.devicePixelRatio || 1, location.href].join(' ');
  };
  window.__setMoodIndex = function (value) {
    var moods = ['idle','happy','thinking','sleepy','sad','surprised'];
    applyAgentState(null, null, moods[Math.max(0, Math.min(5, Number(value) || 0))], null);
  };
  window.addEventListener('unhandledrejection', function (event) {
    fail('unhandled promise: ' + (event.reason && (event.reason.stack || event.reason.message) || event.reason || 'unknown'));
  });

  function startModel() {
    var explicitEntry = params.get('entry');
    if (explicitEntry) {
      initPixi();
      loadModel(DIR, explicitEntry);
      return;
    }
    var marker = document.createElement('script');
    marker.src = new URL('model-entry.js', DIR).href;
    marker.onload = function () {
      var info = window.HyperCatLive2DModel;
      if (!info || typeof info.entry !== 'string' ||
          !info.entry.toLowerCase().endsWith('.model3.json') ||
          !info.entry || info.entry.split('/').indexOf('..') >= 0) {
        fail('invalid model-entry.js at ' + marker.src);
        return;
      }
      try {
        initPixi();
        loadModel(DIR, info.entry);
      } catch (error) { fail('init ' + error); }
    };
    marker.onerror = function () { fail('model-entry.js load failed: ' + marker.src); };
    document.head.appendChild(marker);
  }

  try { startModel(); } catch (e) { fail('init ' + e); }
})();
</script>
</body>
</html>
