<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000"><title>HyperCat Face Engine</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#e8f7ff;font-family:system-ui,sans-serif}main{height:100%;display:flex;flex-direction:column;background:#000}header{padding:18px 20px 8px;display:flex;justify-content:space-between}.brand{font-size:12px;letter-spacing:.2em;font-weight:700;color:#7ddfff}.version{font-size:11px;color:#496579}.stage{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block}.controls{padding:12px 16px max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:linear-gradient(180deg,transparent,#050b12 35%)}button{border:1px solid #18384a;border-radius:12px;background:#081722;color:#bdefff;padding:11px 3px;font-size:12px;min-height:42px}button.active{background:#10344a;border-color:#43c9f2;color:#fff}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:#34556a;pointer-events:none}</style></head><body><main><header><div class="brand">HYPERCAT · FACE ENGINE</div><div class="version">PREVIEW 0.1</div></header><section class="stage"><canvas id="face" aria-label="HyperCat animated cat expression"></canvas><div class="hint">Vector-inspired eyes · Minimal cat expression · Pure black</div></section><nav class="controls" id="controls"><button data-mood="idle" class="active">待机</button><button data-mood="happy">开心</button><button data-mood="curious">好奇</button><button data-mood="thinking">思考</button><button data-mood="sleepy">困倦</button><button data-mood="sad">委屈</button><button data-mood="angry">生气</button><button data-mood="surprised">惊讶</button><button data-mood="love">喜欢</button><button data-mood="sleep">睡觉</button></nav></main><script src="js/face-engine.js"></script><script>
(function(){var canvas=document.getElementById("face"),face=window.HyperCatFace.create(canvas),buttons=document.querySelectorAll("[data-mood]");Array.prototype.forEach.call(buttons,function(b){b.addEventListener("click",function(){face.setMood(b.getAttribute("data-mood"));Array.prototype.forEach.call(buttons,function(x){x.classList.remove("active");});b.classList.add("active");});});canvas.addEventListener("pointermove",function(e){var r=canvas.getBoundingClientRect();face.setGaze(((e.clientX-r.left)/r.width-.5)*1.4,((e.clientY-r.top)/r.height-.5)*1.2);});canvas.addEventListener("pointerleave",function(){face.setGaze(0,0);});canvas.addEventListener("click",function(){face.setMood("happy",220);});}());
</script></body></html>
